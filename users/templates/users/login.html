<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
</head>
<body>
{% include 'navbar.html' %}
<div class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-center text-blue-300">Login</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <div>
            <label for="user_type" class="block mb-2">I am a:</label>
            <select name="user_type" id="user_type"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="publisher" class="py-2">Publisher</option>
                <option value="admin" class="py-2">Admin</option>
            </select>
        </div>
        {% if form.non_field_errors %}
        <div class="mt-4 text-red-500 text-center">
            {% for error in form.non_field_errors %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>
    {% endif %}
        <button type="submit" class="w-full bg-green-200  text-white py-2 px-4 rounded hover:bg-green-300 transition">
        
            Login
        </button>
    </form>
    <div class="text-center mt-4">
        <a href="{% url 'register' %}" class="text-green-500 hover:text-green-600 hover:underline">Don't have an account? Register</a>
    </div>

</div>
</div>
</body>
</html>
